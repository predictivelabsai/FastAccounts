name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q
      - name: Migration from empty and idempotent rerun
        run: |
          FASTACCOUNTS_DB=/tmp/fastaccounts-ci.sqlite python - <<'PY'
          from database import get_database
          db = get_database()
          assert db.migrate() == ['0001_accounting_core', '0002_integrations', '0003_operations', '0004_document_immutability']
          assert db.migrate() == []
          PY
      - name: Secret pattern guard
        run: |
          if git grep -nE '(sk_live_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':!*.svg'; then
            echo 'Potential committed secret found'
            exit 1
          fi
      - run: docker build -t fastaccounts-ci .
