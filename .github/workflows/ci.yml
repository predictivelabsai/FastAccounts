name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q
      - name: Migration from empty and idempotent rerun
        run: |
          FASTACCOUNTS_DB=/tmp/fastaccounts-ci.sqlite python - <<'PY'
          from database import get_database
          db = get_database()
          assert db.migrate() == ['0001_accounting_core', '0002_integrations', '0003_operations', '0004_document_immutability', '0005_payroll', '0006_payroll_part_time_hourly', '0007_automation', '0008_import_staging', '0009_local_accounts', '0010_tsd_export', '0011_account_mappings', '0012_external_gl', '0013_sync_review', '0014_sync_push', '0015_payment_orders', '0016_bank_feed_schedules', '0017_prepayments', '0018_fixed_assets', '0019_master_data_import', '0020_quotes', '0021_periodisation', '0022_payment_links', '0023_analytical_objects', '0024_reminder_rules', '0025_fx_realised', '0026_fx_revaluations', '0027_mfa', '0028_document_settings', '0029_copilot', '0030_master_data_maintenance', '0031_master_data_groups', '0032_copilot_access', '0033_copilot_settings', '0034_payroll_demo_fixes', '0035_payroll_income_line', '0036_payroll_component_catalogue', '0037_employee_tax_settings', '0038_payroll_payday_rules', '0039_payroll_payouts', '0040_payroll_settlement_dates', '0041_payroll_sepa_details', '0042_payroll_component_metadata', '0043_payroll_absences', '0044_payroll_absence_day_freeze', "0045_payroll_history", "0046_payroll_absence_pay", "0047_payroll_absence_payouts", "0048_payroll_component_breakdown", "0049_payroll_component_source", "0050_payroll_history_import", "0051_payroll_leave_liability", "0052_payroll_tsd_payment_types", "0053_payroll_tsd_base_snapshot", "0054_payroll_tsd_lines", "0055_tsd_apa_history", "0056_payroll_corrections", "0057_payroll_employee_receivables", "0058_payroll_receivable_offset_accounts", "0059_tsd_apa_operation_history", "0060_payroll_run_lineage_tenancy"]
          assert db.migrate() == []
          PY
      - name: Secret pattern guard
        run: |
          if git grep -nE '(sk_live_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':!*.svg'; then
            echo 'Potential committed secret found'
            exit 1
          fi
      - run: docker build -t fastaccounts-ci .
